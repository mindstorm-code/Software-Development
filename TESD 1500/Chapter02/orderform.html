<!doctype html>
<html>

  <body>

    <h2>Place an Order</h2>

      <table border="0" cellpadding="5">
        <tr>
          <th>Item</th>
          <th>Quantity</th>
        </tr>

        <tr>
          <td>Tires ($100 each)</td>
          <td>
            <input type="number" name="tireqty" min="0" value="0" />

          <td>
            <input type="number" name="oilqty" min="0" value="0" />
