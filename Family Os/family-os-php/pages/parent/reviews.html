<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews — Family OS</title>
  <link rel="stylesheet" href="/family-os/assets/css/main.css">
  <script>(function(){try{var u=JSON.parse(localStorage.getItem('fos_user')||'{}');var t=localStorage.getItem('fos_parent_theme_'+(u.id||'guest'))||'dark';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})()</script>
  <link rel="stylesheet" href="/family-os/assets/css/parent-dark.css">
  <style>
    .tab-bar { display:flex; border-bottom:2px solid var(--border); margin:0 0 1rem; }
    .r-tab { flex:1; padding:.65rem; text-align:center; font-weight:700; font-size:.88rem; cursor:pointer; color:var(--text-3); border:none; background:none; border-bottom:3px solid transparent; margin-bottom:-2px; }
    .r-tab.active { color:var(--primary); border-bottom-color:var(--primary); }
  </style>
</head>
<body>
<div class="page">

  <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;padding:1rem">
    <div style="display:flex;align-items:center;gap:.5rem">
      <a href="dashboard.html" class="btn btn-icon btn-ghost" id="btn-back"></a>
      <h1 style="font-size:1.2rem;font-weight:700;margin:0">✅ Reviews</h1>
    </div>
    <span class="badge badge-warning" id="pending-count" style="display:none"></span>
  </div>

  <div class="tab-bar">
    <button class="r-tab active" onclick="switchTab('chores',this)">Chore Submissions</button>
    <button class="r-tab" onclick="switchTab('rewards',this)">Reward Requests</button>
    <button class="r-tab" onclick="switchTab('requests',this)">✉️ Requests</button>
  </div>

  <div class="page-content" style="padding-bottom:80px">
    <div id="pane-chores">
      <div style="text-align:center;padding:3rem"><span class="spinner"></span></div>
    </div>
    <div id="pane-rewards" class="hidden">
      <div style="text-align:center;padding:3rem"><span class="spinner"></span></div>
    </div>
    <div id="pane-requests" class="hidden">
      <div style="text-align:center;padding:3rem"><span class="spinner"></span></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item" id="nav-home"><span class="nav-icon"></span><span>Home</span></a>
    <a href="chores.html"    class="nav-item" id="nav-chores"><span class="nav-icon"></span><span>Chores</span></a>
    <a href="children.html"  class="nav-item" id="nav-family"><span class="nav-icon"></span><span>Family</span></a>
    <a href="reviews.html"   class="nav-item active" id="nav-reviews" style="position:relative"><span class="nav-icon"></span><span>Reviews</span><span id="nav-reviews-badge" style="display:none;position:absolute;top:6px;right:10px;background:#EF4444;color:#fff;font-size:.6rem;font-weight:700;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center;line-height:1.5"></span></a>
    <a href="rewards.html"   class="nav-item" id="nav-rewards"><span class="nav-icon"></span><span>Rewards</span></a>
  </nav>
</div>

<script src="/family-os/assets/js/demo.js"></script>
<script src="/family-os/assets/js/auth.js"></script>
<script src="/family-os/assets/js/api.js"></script>
<script src="/family-os/assets/js/ui.js"></script>
<script>
Auth.requireParent();

(function(){
  document.getElementById('btn-back').innerHTML = iconBack();
  const navIcons = [[iconHome,'nav-home'],[iconList,'nav-chores'],[iconUsers,'nav-family'],[iconCheck,'nav-reviews'],[iconGift,'nav-rewards']];
  navIcons.forEach(([fn, id]) => { const el = document.querySelector('#' + id + ' .nav-icon'); if(el) el.innerHTML = fn(); });
})();

const coin = getCoinConfig();

function switchTab(name, btn) {
  document.querySelectorAll('.r-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  ['chores','rewards','requests'].forEach(t => {
    document.getElementById('pane-' + t).classList.toggle('hidden', t !== name);
  });
}

// ── CHORE SUBMISSIONS ──────────────────────────────────────────
async function loadChoreReviews() {
  const el = document.getElementById('pane-chores');
  try {
    const res     = await SubmissionsAPI.list();
    const all     = Array.isArray(res) ? res : (res?.data || []);
    const pending = all.filter(s => s.status === 'pending' || s.status === 'submitted');

    const countEl = document.getElementById('pending-count');
    if (pending.length) { countEl.textContent = pending.length + ' pending'; countEl.style.display = ''; }
    else countEl.style.display = 'none';

    if (!pending.length) {
      el.innerHTML = '<div class="empty-state">🎉 All caught up! No pending chore reviews.</div>';
      return;
    }

    el.innerHTML = pending.map(s => {
      const kidName   = s.child?.display_name || 'Kid';
      const choreName = s.chore?.title || 'Chore';
      const _c = s.chore || {};
      const defaultPts = _c.usd_value ? coin.usdToFC(_c.usd_value) : (_c.points || 10);
      const pts = s.points_awarded || defaultPts;
      const hasPhotos = s.photo_urls?.length > 0;
      return `
        <div class="card mb-2" id="sub-${s.id}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.5rem">
            <div>
              <div style="font-weight:700;font-size:1rem">${choreName}</div>
              <div style="font-size:.82rem;color:var(--text-3)">${kidName} · ${relativeTime(s.submitted_at)}</div>
            </div>
            ${ptsBadge(pts)}
          </div>

          ${s.notes ? `<div style="font-size:.85rem;color:var(--text-2);font-style:italic;margin-bottom:.5rem">💬 "${s.notes}"</div>` : ''}

          ${hasPhotos ? `
            <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.5rem">
              ${s.photo_urls.map(u => u === '__photo__'
                ? `<div style="width:80px;height:80px;border-radius:8px;background:var(--bg-2);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.1rem">
                     <span style="font-size:1.3rem">📷</span><span style="font-size:.6rem;color:var(--text-3)">photo</span>
                   </div>`
                : `<img src="${u}" onclick="openPhoto('${u}')"
                     style="width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:zoom-in;border:2px solid var(--border)">`
              ).join('')}
            </div>
          ` : ''}

          <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.65rem">
            <label style="font-size:.85rem;font-weight:600;white-space:nowrap">${coin.icon} ${coin.symbol}:</label>
            <input class="form-control" type="number" id="pts-${s.id}" value="${pts}" min="1"
              style="width:80px;text-align:center"
              oninput="this.style.outline=parseInt(this.value)>0?'':'2px solid #EF4444'">
          </div>

          <div style="margin-bottom:.5rem">
            <input class="form-control" type="text" id="note-${s.id}" placeholder="Feedback for ${kidName} (optional)" style="font-size:.82rem">
          </div>

          <div style="display:flex;gap:.5rem">
            <button class="btn btn-full" style="background:#FEE2E2;color:#DC2626;font-weight:700"
              onclick="reviewChore('${s.id}','reject',this)">✕ Reject</button>
            <button class="btn btn-full" style="background:#DCFCE7;color:#16A34A;font-weight:700"
              onclick="reviewChore('${s.id}','approve',this)">✓ Approve</button>
          </div>
        </div>`;
    }).join('');

  } catch(e) {
    el.innerHTML = `<div class="empty-state" style="color:var(--danger)">Failed to load submissions.<br><small>${e.message}</small></div>`;
  }
}

async function reviewChore(id, action, btn) {
  const pts  = parseInt(document.getElementById('pts-' + id)?.value) || 0;
  const note = document.getElementById('note-' + id)?.value.trim() || '';
  // Guard: warn parent if approving with 0 coins so it's intentional, not an accident
  if (action === 'approve' && pts < 1) {
    const el = document.getElementById('pts-' + id);
    if (el) { el.style.outline = '2px solid #EF4444'; el.focus(); }
    Toast.error('Set a ' + coin.symbol + ' amount before approving (minimum 1).');
    return;
  }
  setLoading(btn, true);
  try {
    await SubmissionsAPI.review({ submission_id: id, action, points: pts, feedback: note });
    Toast.success(action === 'approve' ? '✅ Approved! ' + pts + ' ' + coin.symbol + ' awarded.' : '❌ Rejected');
    document.getElementById('sub-' + id)?.remove();
    const remaining = document.querySelectorAll('[id^="sub-"]').length;
    if (!remaining) loadChoreReviews();
    else {
      const countEl = document.getElementById('pending-count');
      countEl.textContent = remaining + ' pending';
    }
  } catch(e) {
    Toast.error(e.message);
    setLoading(btn, false);
  }
}

// ── REWARD / COUPON REDEMPTION REQUESTS ───────────────────────
async function loadRewardReviews() {
  const el = document.getElementById('pane-rewards');
  try {
    const [rwdRes, cpnRes] = await Promise.all([
      api.get('/rewards/redeem.php').catch(() => ({ data: [] })),
      api.get('/coupons/redeem.php').catch(() => ({ data: [] })),
    ]);

    const rwdList = Array.isArray(rwdRes) ? rwdRes : (rwdRes?.data || []);
    const cpnList = Array.isArray(cpnRes) ? cpnRes : (cpnRes?.data || []);
    const all = [
      ...rwdList.filter(r => r.status === 'pending').map(r => ({ ...r, _type: 'reward' })),
      ...cpnList.filter(r => r.status === 'pending').map(r => ({ ...r, _type: 'coupon' })),
    ];

    if (!all.length) {
      el.innerHTML = '<div class="empty-state">🎁 No pending reward requests.</div>';
      return;
    }

    el.innerHTML = all.map(r => {
      const title   = r.reward?.title || r.coupon?.title || 'Request';
      const kidName = r.child?.display_name || 'Kid';
      const pts     = r.points_spent || 0;
      const usd     = r.coupon?.usd_value
        ? `<span class="badge badge-success">$${parseFloat(r.coupon.usd_value).toFixed(2)}</span>` : '';
      return `
        <div class="card mb-2" id="red-${r.id}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.75rem">
            <div>
              <div style="font-weight:700;font-size:1rem">${r._type === 'coupon' ? '🎟️' : '🎁'} ${title}</div>
              <div style="font-size:.82rem;color:var(--text-3)">${kidName} · ${relativeTime(r.redeemed_at)}</div>
            </div>
            <div style="display:flex;gap:.35rem;flex-wrap:wrap">${usd}${ptsBadge(pts)}</div>
          </div>
          <div style="display:flex;gap:.5rem">
            <button class="btn btn-full" style="background:#FEE2E2;color:#DC2626;font-weight:700"
              onclick="reviewRedemption('${r.id}','${r._type}','reject',this)">✕ Reject</button>
            <button class="btn btn-full" style="background:#DCFCE7;color:#16A34A;font-weight:700"
              onclick="reviewRedemption('${r.id}','${r._type}','approve',this)">✓ Approve</button>
          </div>
        </div>`;
    }).join('');

  } catch(e) {
    el.innerHTML = `<div class="empty-state" style="color:var(--danger)">Failed to load requests.<br><small>${e.message}</small></div>`;
  }
}

async function reviewRedemption(id, type, action, btn) {
  setLoading(btn, true);
  try {
    const endpoint = type === 'coupon' ? '/coupons/redeem.php' : '/rewards/redeem.php';
    await api.post(endpoint, { redemption_id: id, action });
    Toast.success(action === 'approve' ? '✅ Approved!' : '❌ Rejected');
    document.getElementById('red-' + id)?.remove();
    const remaining = document.querySelectorAll('[id^="red-"]').length;
    if (!remaining) loadRewardReviews();
  } catch(e) {
    Toast.error(e.message);
    setLoading(btn, false);
  }
}

// ── KID COUPON REQUESTS ────────────────────────────────────────
async function loadCouponRequests() {
  const el = document.getElementById('pane-requests');
  try {
    const res  = await api.get('/coupons/request.php?status=pending');
    const reqs = Array.isArray(res) ? res : (res?.data || []);

    if (!reqs.length) {
      el.innerHTML = '<div class="empty-state">✉️ No custom requests from kids.</div>';
      return;
    }

    el.innerHTML = reqs.map(r => `
      <div class="card mb-2" id="creq-${r.id}">
        <div style="margin-bottom:.5rem">
          <div style="font-weight:700;font-size:1rem">${r.title}</div>
          <div style="font-size:.82rem;color:var(--text-3)">${r.child?.display_name || 'Kid'} · ${relativeTime(r.created_at)}</div>
        </div>
        ${r.description ? `<div style="font-size:.85rem;color:var(--text-2);font-style:italic;margin-bottom:.5rem">💬 "${r.description}"</div>` : ''}
        <div style="display:flex;gap:.5rem">
          <button class="btn btn-full" style="background:#FEE2E2;color:#DC2626;font-weight:700"
            onclick="resolveRequest('${r.id}','deny',this)">✕ Deny</button>
          <button class="btn btn-full" style="background:#DCFCE7;color:#16A34A;font-weight:700"
            onclick="resolveRequest('${r.id}','approve',this)">✓ Approve</button>
        </div>
      </div>`).join('');

  } catch(e) {
    el.innerHTML = `<div class="empty-state" style="color:var(--danger)">Failed to load requests.<br><small>${e.message}</small></div>`;
  }
}

async function resolveRequest(id, action, btn) {
  setLoading(btn, true);
  try {
    await api.patch('/coupons/request.php?id=' + id, { status: action === 'approve' ? 'approved' : 'denied' });
    Toast.success(action === 'approve' ? '✅ Approved!' : '❌ Denied');
    document.getElementById('creq-' + id)?.remove();
    const remaining = document.querySelectorAll('[id^="creq-"]').length;
    if (!remaining) loadCouponRequests();
  } catch(e) {
    Toast.error(e.message);
    setLoading(btn, false);
  }
}

// ── Photo lightbox ─────────────────────────────────────────────
function openPhoto(url) {
  const lb = document.createElement('div');
  lb.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out';
  lb.innerHTML = `<img src="${url}" style="max-width:100%;max-height:90vh;border-radius:12px;object-fit:contain">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}

loadChoreReviews();
loadReviewsBadge();
loadRewardReviews();
loadCouponRequests();
</script>
</body>
</html>
