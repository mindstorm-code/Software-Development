<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chores — Family OS</title>
  <link rel="stylesheet" href="/family-os/assets/css/main.css">
  <script>(function(){try{var u=JSON.parse(localStorage.getItem('fos_user')||'{}');var t=localStorage.getItem('fos_parent_theme_'+(u.id||'guest'))||'dark';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})()</script>
  <link rel="stylesheet" href="/family-os/assets/css/parent-dark.css">
</head>
<body>
<div class="page">

  <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;padding:1rem">
    <div style="display:flex;align-items:center;gap:.5rem">
      <a href="dashboard.html" class="btn btn-icon btn-ghost" id="btn-back"></a>
      <h1 style="font-size:1.2rem;font-weight:700;margin:0">📋 Chores</h1>
    </div>
    <a href="chore-new.html" class="btn btn-primary btn-sm" id="btn-new"></a>
  </div>

  <div class="page-content" style="padding-bottom:80px">
    <!-- Search + filter bar -->
    <div style="display:flex;gap:.5rem;margin-bottom:.75rem">
      <input class="form-control" id="chore-search" type="search" placeholder="🔍 Search chores…"
        oninput="filterChores()" style="flex:1">
      <select class="form-control" id="chore-filter" onchange="filterChores()" style="width:auto;flex-shrink:0;font-size:.85rem">
        <option value="">All</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="once">One-time</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div id="chores-list">
      <div class="text-center text-muted" style="padding:2rem"><span class="spinner"></span></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item" id="nav-home"><span class="nav-icon"></span><span>Home</span></a>
    <a href="chores.html"    class="nav-item active" id="nav-chores"><span class="nav-icon"></span><span>Chores</span></a>
    <a href="children.html"  class="nav-item" id="nav-family"><span class="nav-icon"></span><span>Family</span></a>
    <a href="reviews.html"   class="nav-item" id="nav-reviews" style="position:relative"><span class="nav-icon"></span><span>Reviews</span><span id="nav-reviews-badge" style="display:none;position:absolute;top:6px;right:10px;background:#EF4444;color:#fff;font-size:.6rem;font-weight:700;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center;line-height:1.5"></span></a>
    <a href="rewards.html"   class="nav-item" id="nav-rewards"><span class="nav-icon"></span><span>Rewards</span></a>
  </nav>
</div>

<script src="/family-os/assets/js/demo.js"></script>
<script src="/family-os/assets/js/auth.js"></script>
<script src="/family-os/assets/js/api.js"></script>
<script src="/family-os/assets/js/ui.js"></script>
<script>
Auth.requireParent();

(function(){
  document.getElementById('btn-back').innerHTML = iconBack();
  document.getElementById('btn-new').innerHTML  = iconPlus() + ' New';
  const navIcons = [[iconHome,'nav-home'],[iconList,'nav-chores'],[iconUsers,'nav-family'],[iconCheck,'nav-reviews'],[iconGift,'nav-rewards']];
  navIcons.forEach(([fn, id]) => { const el = document.querySelector('#' + id + ' .nav-icon'); if (el) el.innerHTML = fn(); });
})();

let _allChores = [];
let _kidMap    = {};

async function loadChores() {
  try {
    const res    = await ChoresAPI.list();
    _allChores   = Array.isArray(res) ? res : (res?.data || res?.chores || []);
    const el     = document.getElementById('chores-list');
    if (!_allChores.length) {
      el.innerHTML = '<div class="empty-state">No chores yet.<br><a href="chore-new.html" class="btn btn-primary mt-2">+ Create First Chore</a></div>';
      return;
    }
    const kids = await ChildrenAPI.list().then(r => Array.isArray(r) ? r : (r?.data || r?.children || [])).catch(() => []);
    _kidMap = Object.fromEntries(kids.map(k => [k.id, k.display_name]));
    filterChores();
  } catch(e) {
    document.getElementById('chores-list').innerHTML = '<div class="empty-state text-danger">Failed to load chores.</div>';
    Toast.error(e.message);
  }
}

function filterChores() {
  const q      = (document.getElementById('chore-search')?.value || '').toLowerCase();
  const filter = document.getElementById('chore-filter')?.value || '';
  const coin   = getCoinConfig();
  const el     = document.getElementById('chores-list');

  const filtered = _allChores.filter(c => {
    const matchQ = !q || c.title.toLowerCase().includes(q) || (c.description || '').toLowerCase().includes(q);
    const matchF = !filter ||
      c.recurrence === filter ||
      c.difficulty  === filter;
    return matchQ && matchF;
  });

  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state">No chores match your search.</div>';
    return;
  }

  el.innerHTML = filtered.map(c => {
    const fc = c.usd_value ? coin.usdToFC(c.usd_value) : (c.points || 0);
    return `
    <div class="card mb-2">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:1rem;margin-bottom:.25rem">${c.title}</div>
          <div style="display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.35rem">
            ${diffBadge(c.difficulty)}
            ${ptsBadge(fc)}
            <span class="badge badge-neutral">${c.recurrence || 'once'}</span>
            ${!c.assigned_to ? '<span class="badge badge-neutral">All kids</span>' : c.assigned_to === 'any' ? '<span class="badge badge-neutral">🎯 Free For All</span>' : `<span class="badge badge-info">👤 ${_kidMap[c.assigned_to] || c.assigned_to}</span>`}
          </div>
          ${c.description ? `<div class="text-sm text-muted truncate">${c.description}</div>` : ''}
        </div>
        <div style="display:flex;gap:.35rem;flex-shrink:0">
          <a href="chore-edit.html?id=${c.id}" class="btn btn-icon btn-ghost btn-sm" title="Edit" style="color:var(--primary)">${iconEdit()}</a>
          <button class="btn btn-icon btn-ghost btn-sm" style="color:var(--danger)" title="Delete" onclick="deleteChore('${c.id}', '${c.title.replace(/'/g,"\\'")}')">
            ${iconTrash()}
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function deleteChore(id, title) {
  if (!await typeConfirm(`Delete chore "${title}"? This cannot be undone.`)) return;
  try {
    await ChoresAPI.delete(id);
    Toast.success('Chore deleted.');
    loadChores();
  } catch(e) { Toast.error(e.message); }
}

loadChores();
loadReviewsBadge();
</script>
</body>
</html>
