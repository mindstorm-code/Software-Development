<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family OS</title>
  <link rel="stylesheet" href="/family-os/assets/css/main.css">
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh; text-align:center; padding:2rem; }
    .logo { font-size:4rem; margin-bottom:.5rem; }
    h1   { font-size:2rem; font-weight:800; margin-bottom:.25rem; }
    p    { color:var(--text-2); margin-bottom:2rem; }
    .btn-row { display:flex; gap:.75rem; flex-wrap:wrap; justify-content:center; }
  </style>
</head>
<body>
<script>
  // If a session already exists, skip this page and go straight in
  const _token = localStorage.getItem('fos_token');
  const _user  = localStorage.getItem('fos_user');
  if (_token && _user) {
    try {
      const u = JSON.parse(_user);
      location.replace(u.role === 'parent'
        ? '/family-os/pages/parent/dashboard.html'
        : '/family-os/pages/child/dashboard.html');
    } catch(e) {}
  }
</script>

<div class="logo">🏠</div>
<h1>Family OS</h1>
<p>Your family, organized.</p>

<div class="btn-row">
  <a href="/family-os/pages/pin-login.html" class="btn btn-primary" style="font-size:1rem;padding:.8rem 2rem">Sign In</a>
  <a href="/family-os/pages/signup.html"    class="btn btn-secondary" style="font-size:1rem;padding:.8rem 2rem">Create Family</a>
</div>
</body>
</html>
